[package]
name = "rusty_scanner"
version = "0.1.0"
edition = "2024"
description = "Rusty Intelli Scanner: matches miscellaneous video files to anchor directories, previews matches via CSV, and orchestrates rusty_dedup + rusty_clean consolidation with multi-anchor symlinks."

[[bin]]
name = "rusty_scanner"
path = "src/main.rs"

[[bin]]
name = "rusty_triage"
path = "src/bin/rusty_triage.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
strsim = "0.11"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
